[project]
name = "binforge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "ipython>=8.0",
]

[project.scripts]
binforge = "binforge.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
build = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pyright]
pythonVersion = "3.13"
strict = true
